name: Terraform CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: terraform-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  kubernetes:
    name: Check Kubernetes manifests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: "v1.34.1"

      - name: Build network policies without a cluster
        run: kubectl kustomize infra/kubernetes/network-policies > "$RUNNER_TEMP/bodyvision-network-policies.yaml"

  format:
    name: Check Terraform formatting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.14.4"
          terraform_wrapper: false

      - name: Check formatting
        working-directory: infra/terraform
        run: terraform fmt -check -recursive

  validate:
    name: Validate ${{ matrix.root }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        root:
          - bootstrap
          - environments/persistent
          - environments/dev
          - environments/prod

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.14.4"
          terraform_wrapper: false

      - name: Initialize without remote backend
        working-directory: infra/terraform/${{ matrix.root }}
        run: terraform init -backend=false -input=false -lockfile=readonly

      - name: Validate configuration
        working-directory: infra/terraform/${{ matrix.root }}
        run: terraform validate -no-color

  trivy:
    name: Trivy infrastructure
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scanner le dépôt avec Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.1
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL
          exit-code: '1'
          ignore-unfixed: false
          skip-dirs: .git,**/.terraform
